<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 840">
    <defs>
        <radialGradient id="rg1">
            <stop offset="0%" stop-color="#000" />
            <stop offset="50%" stop-color="hsl(0,0%,50%)" />
            <stop offset="100%" stop-color="#FFF" />
        </radialGradient>
        <linearGradient id="lg1" gradientUnits="objectBoundingBox">
            <stop offset="0%" stop-color="#FFF" />
            <stop offset="40%" stop-color="#000" />
            <stop offset="60%" stop-color="#000" />
            <stop offset="100%" stop-color="#FFF" />
        </linearGradient>
        <linearGradient id="lg2" gradientUnits="objectBoundingBox" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="#FFF" />
            <stop offset="40%" stop-color="#000" />
            <stop offset="60%" stop-color="#000" />
            <stop offset="100%" stop-color="#FFF" />
        </linearGradient>
        <mask id="cm">
            <rect width="90" height="90" x="5" y="5" fill="#000" stroke-width="10" stroke="#FFF"/>
        </mask>
        <style>
            .cell {
                stroke-width: 10;
                width: 90px;
                height: 90px;
            }

            .cell.dark {
                fill: hsla(20, 50%, 10%, 1);
                stroke: hsla(20, 50%, 20%, 1);
            }

            .cell.light {
                fill: hsla(20, 50%, 30%, 1);
                stroke: hsla(20, 50%, 40%, 1);
            }

            .debug {
                stroke-width: 0;
                width: 90px;
                height: 90px;
                fill: url(#rg1);
            }
        </style>
    </defs>
    <!-- grp 0 -->
    <g>
        <rect class="cell dark" x="005" y="005" />
        <rect class="cell dark" x="095" y="005" />
        <rect class="cell dark" x="185" y="005" />
        <rect class="cell dark" x="005" y="095" />
        <rect class="cell dark" x="095" y="095" />
        <rect class="cell dark" x="185" y="095" />
        <rect class="cell dark" x="005" y="185" />
        <rect class="cell dark" x="095" y="185" />
        <rect class="cell dark" x="185" y="185" />
    </g>
    <!-- grp 1 -->
    <g>
        <rect class="cell light" x="285" y="005" />
        <rect class="cell light" x="375" y="005" />
        <rect class="cell light" x="465" y="005" />
        <rect class="cell light" x="285" y="095" />
        <rect class="cell light" x="375" y="095" />
        <rect class="cell light" x="465" y="095" />
        <rect class="cell light" x="285" y="185" />
        <rect class="cell light" x="375" y="185" />
        <rect class="cell light" x="465" y="185" />
    </g>
    <!-- grp 2 -->
    <g>
        <rect class="cell dark" x="565" y="005" />
        <rect class="cell dark" x="655" y="005" />
        <rect class="cell dark" x="745" y="005" />
        <rect class="cell dark" x="565" y="095" />
        <rect class="cell dark" x="655" y="095" />
        <rect class="cell dark" x="745" y="095" />
        <rect class="cell dark" x="565" y="185" />
        <rect class="cell dark" x="655" y="185" />
        <rect class="cell dark" x="745" y="185" />
    </g>
    <!-- grp 3 -->
    <g>
        <rect class="cell light" x="005" y="285" />
        <rect class="cell light" x="095" y="285" />
        <rect class="cell light" x="185" y="285" />
        <rect class="cell light" x="005" y="375" />
        <rect class="cell light" x="095" y="375" />
        <rect class="cell light" x="185" y="375" />
        <rect class="cell light" x="005" y="465" />
        <rect class="cell light" x="095" y="465" />
        <rect class="cell light" x="185" y="465" />
    </g>
    <!-- grp 4-->
    <g>
        <rect class="cell dark" x="285" y="285" />
        <rect class="cell dark" x="375" y="285" />
        <rect class="cell dark" x="465" y="285" />
        <rect class="cell dark" x="285" y="375" />
        <rect class="cell dark" x="375" y="375" />
        <rect class="cell dark" x="465" y="375" />
        <rect class="cell dark" x="285" y="465" />
        <rect class="cell dark" x="375" y="465" />
        <rect class="cell dark" x="465" y="465" />
    </g>
    <!-- grp 5-->
    <g>
        <rect class="cell light" x="565" y="285" />
        <rect class="cell light" x="655" y="285" />
        <rect class="cell light" x="745" y="285" />
        <rect class="cell light" x="565" y="375" />
        <rect class="cell light" x="655" y="375" />
        <rect class="cell light" x="745" y="375" />
        <rect class="cell light" x="565" y="465" />
        <rect class="cell light" x="655" y="465" />
        <rect class="cell light" x="745" y="465" />
    </g>
    <!-- grp 6-->
    <g>
        <rect class="cell dark" x="005" y="565" />
        <rect class="cell dark" x="095" y="565" />
        <rect class="cell dark" x="185" y="565" />
        <rect class="cell dark" x="005" y="655" />
        <rect class="cell dark" x="095" y="655" />
        <rect class="cell dark" x="185" y="655" />
        <rect class="cell dark" x="005" y="745" />
        <rect class="cell dark" x="095" y="745" />
        <rect class="cell dark" x="185" y="745" />
    </g>
    <!-- grp 7 -->
    <g>
        <rect class="cell light" x="285" y="565" />
        <rect class="cell light" x="375" y="565" />
        <rect class="cell light" x="465" y="565" />
        <rect class="cell light" x="285" y="655" />
        <rect class="cell light" x="375" y="655" />
        <rect class="cell light" x="465" y="655" />
        <rect class="cell light" x="285" y="745" />
        <rect class="cell light" x="375" y="745" />
        <rect class="cell light" x="465" y="745" />
    </g>
    <!-- grp 8 -->
    <g>
        <rect class="cell dark" x="565" y="565" />
        <rect class="cell dark" x="655" y="565" />
        <rect class="cell dark" x="745" y="565" />
        <rect class="cell dark" x="565" y="655" />
        <rect class="cell dark" x="655" y="655" />
        <rect class="cell dark" x="745" y="655" />
        <rect class="cell dark" x="565" y="745" />
        <rect class="cell dark" x="655" y="745" />
        <rect class="cell dark" x="745" y="745" />
    </g>
    <!-- grp borders -->
    <rect width="5" height="100%" x="000.0" fill="hsla(20, 50%, 60%, 1)" />
    <rect width="5" height="100%" x="277.5" fill="hsla(20, 50%, 60%, 1)" />
    <rect width="5" height="100%" x="557.5" fill="hsla(20, 50%, 60%, 1)" />
    <rect width="5" height="100%" x="835.0" fill="hsla(20, 50%, 60%, 1)" />
    <rect height="5" width="100%" y="000.0" fill="hsla(20, 50%, 60%, 1)" />
    <rect height="5" width="100%" y="277.5" fill="hsla(20, 50%, 60%, 1)" />
    <rect height="5" width="100%" y="557.5" fill="hsla(20, 50%, 60%, 1)" />
    <rect height="5" width="100%" y="835.0" fill="hsla(20, 50%, 60%, 1)" />
     
</svg>