<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90">
    <defs>
        <linearGradient id="lg1">
            <stop offset="0%" stop-color="#FFF" />
            <stop offset="5%" stop-color="#000" />
            <stop offset="95%" stop-color="#000" />
            <stop offset="100%" stop-color="#FFF" />
        </linearGradient>
        <linearGradient id="lg2" gradientTransform="rotate(90)">
            <stop offset="0%" stop-color="#FFF" />
            <stop offset="5%" stop-color="#000" />
            <stop offset="95%" stop-color="#000" />
            <stop offset="100%" stop-color="#FFF" />
        </linearGradient>
        <mask id="m1">
            <rect width="90" height="90" fill="white" />
            <rect width="80" height="80" transform="translate(5 5)" fill="black" />
        </mask>
        <mask id="mlg1">
            <rect width="100%" height="100%" x="0" y="0" fill="url(#lg1)" />
        </mask>
        <mask id="mlg2">
            <rect width="100%" height="100%" x="0" y="0" fill="url(#lg2)" />
        </mask>
        <mask id="rm1">
            <circle cx="0" cy="0" r="85" fill="url(#rg1)" filter="invert()" />
        </mask>
        <!-- Shadow 1 -->
        <linearGradient id="sg1">
            <stop offset="0" stop-color="hsl(0, 0%, 80%)" />
            <stop offset="1" stop-color="hsl(0, 0%, 0%)" />
        </linearGradient>
        <mask id="sgm1">
            <rect width="10" height="80" x="5" y="5" fill="url(#sg1)" />
        </mask>
        <!-- Shadow 2 -->
        <linearGradient id="sg2" gradientTransform="rotate(90)">
            <stop offset="0" stop-color="hsl(0, 0%, 80%)" />
            <stop offset="1" stop-color="hsl(0, 0%, 0%)" />
        </linearGradient>
        <mask id="sgm2">
            <rect width="80" height="10" x="5" y="5" fill="url(#sg2)" />
        </mask>
    </defs>
    <g mask="url(#m1)">
        <rect width="100%" height="100%" x="0" y="0" fill="#000" />
        <rect width="100%" height="100%" x="0" y="0" fill="#FFF" mask="url(#mlg1)" />
        <rect width="100%" height="100%" x="0" y="0" fill="#FFF" mask="url(#mlg2)" />
    </g>
    <rect width="10" height="80" x="5" y="5" fill="#000" mask="url(#sgm1)" />
    <rect width="80" height="10" x="5" y="5" fill="#000" mask="url(#sgm2)" />
</svg>